<!doctype html>
<html lang="mn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Deed AI</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        max-width: 34rem;
        margin: 4rem auto;
        padding: 0 1.25rem;
        line-height: 1.6;
      }
      h1 { font-size: 1.35rem; margin-bottom: 0.25rem; }
      p { margin: 0.4rem 0; }
      .muted { opacity: 0.7; font-size: 0.9rem; }
      code {
        background: color-mix(in srgb, currentColor 10%, transparent);
        padding: 0.15em 0.4em;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <h1>Deed AI</h1>
    <p>Соёл Эрдэм Дээд Сургуулийн Messenger туслах ажиллаж байна.</p>
    <p class="muted">
      Төлөв шалгах: <a href="/health"><code>/health</code></a><br />
      Webhook: <code>/webhook</code> (зөвхөн Facebook хандана)
    </p>
  </body>
</html>
